<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>%sveltekit.status% · %sveltekit.error.message%</title>
    <!-- The last resort when an error page itself fails; it mirrors ErrorView without the app. -->
    <style>
      :root {
        --background: #fff;
        --foreground: #171717;
        --muted: #737373;
        --primary: #171717;
        --primary-text: #fafafa;
        --border: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --foreground: #fafafa;
          --muted: #a3a3a3;
          --primary: #fafafa;
          --primary-text: #171717;
          --border: #262626;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 4rem 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Apple SD Gothic Neo',
          'Malgun Gothic',
          sans-serif;
        text-align: center;
        word-break: keep-all;
      }
      .status {
        margin: 0;
        font-size: clamp(4.5rem, 18vw, 8rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: var(--primary);
      }
      h1 {
        margin: 1.25rem 0 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      p.help {
        max-width: 28rem;
        margin: 0.75rem auto 0;
        color: var(--muted);
        line-height: 1.5;
        text-wrap: pretty;
      }
      a {
        display: inline-flex;
        align-items: center;
        height: 2.25rem;
        margin-top: 2rem;
        padding: 0 0.75rem;
        border-radius: 0.375rem;
        background: var(--primary);
        color: var(--primary-text);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        opacity: 0.8;
      }
      a:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--muted) 50%, transparent);
        outline-offset: 2px;
      }
      @media (min-width: 40rem) {
        h1 {
          font-size: 1.875rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">%sveltekit.status%</p>
      <h1>문제가 생겼습니다</h1>
      <p class="help">
        잠시 후 다시 시도해 주세요. 문제가 계속되면 사이트 관리자에게 알려
        주세요.
      </p>
      <a href="/">홈으로</a>
    </main>
  </body>
</html>
